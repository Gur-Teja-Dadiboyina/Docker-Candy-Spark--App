name: Deploy Docker App to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            sudo apt update -y
            sudo apt install git -y

            if [ ! -d "/home/ubuntu/Docker-Candy-Spark--App" ]; then
              git clone https://github.com/Gur-Teja-Dadiboyina/Docker-Candy-Spark--App.git /home/ubuntu/Docker-Candy-Spark--App
            fi

            cd /home/ubuntu/Docker-Candy-Spark--App

            git pull origin main

            docker stop candy-app || true
            docker rm candy-app || true
            docker rmi candy-app || true

            docker build -t candy-app .

            docker run -d \
              --name candy-app \
              -p 80:80 \
              --restart unless-stopped \
              candy-app
